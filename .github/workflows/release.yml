name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build release binaries
        run: go run ./tools/build --release

      - name: Package archives
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p out
          for dir in dist/*/; do
            platform="$(basename "$dir")"
            if [[ "$platform" == windows_* ]]; then
              (cd "$dir" && zip -q "$GITHUB_WORKSPACE/out/mdutils_${version}_${platform}.zip" *)
            else
              tar -czf "out/mdutils_${version}_${platform}.tar.gz" -C "$dir" .
            fi
          done

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          heading="## [${version}]"
          awk -v heading="$heading" '
            index($0, heading) == 1 { flag=1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -s notes.md ]]; then
            gh release create "${GITHUB_REF_NAME}" out/* \
              --title "${GITHUB_REF_NAME}" \
              --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" out/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
